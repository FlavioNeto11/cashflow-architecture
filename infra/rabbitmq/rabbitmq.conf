# Configuracao do broker do MVP (ADR-0002, G1-16). Montado em /etc/rabbitmq/conf.d/20-cashflow.conf, sem substituir
# os padroes da imagem oficial. Nenhum usuario ou senha aqui: o usuario da aplicacao vem de RABBITMQ_DEFAULT_USER/PASS,
# convertido em definicoes no boot por entrypoint.sh (com load_definitions o broker nao cria o usuario padrao).

# Topologia declarativa (exchanges, filas, bindings): definitions.json montado como definitions.d/10-topology.json.
# Os arquivos do diretorio sao importados em ordem alfabetica. Os servicos so fazem declaracao passiva.
load_definitions = /etc/rabbitmq/definitions.d

# 30 min explicitos (G1-16). Invariante: margem do expurgo do Inbox (31 d - 29 d) muito maior que este timeout.
consumer_timeout = 1800000
