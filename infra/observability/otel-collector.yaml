# Receptor OTLP do MVP (F6). NAO e plataforma de observabilidade: recebe logs, metricas e traces das aplicacoes e os
# imprime no stdout do proprio container (exporter "debug"), o que torna a chegada da telemetria verificavel por
# "docker compose logs otel-collector" sem UI. Sem retencao, sem consulta, sem alertas (isso e o ALVO, deployment.md 5).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
